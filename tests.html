<!doctype html><html lang="en"><meta charset="utf-8"><title>Distill numerical tests</title><script src="math.js"></script><body><h1>Numerical verification</h1><pre id="results"></pre><script>
'use strict';
const { logSoftmax, evaluate, update } = DistillMath;
const results = [], teacher = [1.4, .6, .3, 0, -.3], student = [.8, 1.25, .4, 0, -.3];
function test(name, fn) { try { fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ': ' + e.message); } }
function assert(value, message = 'Assertion failed') { if (!value) throw Error(message); }
function close(a, b, tolerance = 1e-7) { assert(Math.abs(a - b) < tolerance, `${a} != ${b}`); }
test('Softmax normalizes for extreme logits and low temperature', () => { const values = logSoftmax([10, -10, 0, 1, -1], .1).map(Math.exp); close(values.reduce((a,b) => a+b), 1); assert(values.every(Number.isFinite)); });
test('Equal distributions give zero KL and zero distillation gradient', () => { const a = evaluate(teacher, teacher, 1, 5, .5), b = evaluate(teacher, teacher, 1, 0, .5); close(a.kl, 0); a.gradient.forEach((g,i) => close(g,b.gradient[i])); });
test('KL direction is teacher to student and is asymmetric', () => { const a = evaluate(teacher, student, 1, 1, .5), b = evaluate(student, teacher, 1, 1, .5); close(a.kl,a.p.reduce((s,p,i) => s+p*Math.log(p/a.q[i]),0)); assert(Math.abs(a.kl-b.kl) > .001); });
test('Signed contributions sum to nonnegative KL', () => { const a = evaluate(teacher,student,1,1,.5); assert(a.contributions.some(v => v<0)); assert(a.kl>=0); close(a.kl,a.contributions.reduce((a,b) => a+b)); });
test('Task loss does not change with distillation temperature', () => { close(evaluate(teacher,student,1,1,.1).task,evaluate(teacher,student,1,1,3).task); });
test('Zero weight removes penalty and distillation gradient', () => { const a = evaluate(teacher,student,1,0,3); close(a.total,a.task); a.gradient.forEach((g,i) => close(g,Math.exp(logSoftmax(student)[i])-Number(i===1))); });
test('Penalty includes lambda and temperature squared', () => { const a = evaluate(teacher,student,1,2,.5); close(a.penalty,2*.25*a.kl); close(a.total,a.task+a.penalty); });
test('Analytic gradient agrees with central finite differences', () => { for (const temperature of [.1,.5,1,3]) for (const lambda of [0,1,5]) { const a=evaluate(teacher,student,1,lambda,temperature); for(let i=0;i<student.length;i++) { const plus=[...student],minus=[...student],eps=1e-5;plus[i]+=eps;minus[i]-=eps; close(a.gradient[i],(evaluate(teacher,plus,1,lambda,temperature).total-evaluate(teacher,minus,1,lambda,temperature).total)/(2*eps),1e-6); } } });
test('Training reduces the objective and never mutates the teacher', () => { const original=[...teacher];let logits=[...student],first=evaluate(teacher,logits,1,1,.5).total;for(let i=0;i<200;i++){const a=evaluate(teacher,logits,1,1,.5);logits=update(logits,a.gradient,.2);}assert(evaluate(teacher,logits,1,1,.5).total<first);teacher.forEach((v,i)=>close(v,original[i])); });
test('SFT-only training raises target probability', () => { let logits=[...student];for(let i=0;i<200;i++) logits=update(logits,evaluate(teacher,logits,1,0,1).gradient,.2);assert(evaluate(teacher,logits,1,0,1).targetProbability>.97); });
test('Translation of logits leaves loss unchanged', () => { close(evaluate(teacher,student,1,1,.5).total,evaluate(teacher.map(v=>v+100),student.map(v=>v-100),1,1,.5).total); });
test('KL-only gradient agrees with finite differences', () => { for (const temperature of [.1,.5,1,3]) { const a=evaluate(teacher,student,1,1,temperature,0); for(let i=0;i<student.length;i++){const plus=[...student],minus=[...student],eps=1e-5;plus[i]+=eps;minus[i]-=eps;close(a.gradient[i],(evaluate(teacher,plus,1,1,temperature,0).total-evaluate(teacher,minus,1,1,temperature,0).total)/(2*eps),1e-6);} } });
test('KL-only reduces KL and moves Greece toward its teacher probability', () => { let logits=[...student],previous=evaluate(teacher,logits,1,1,.5,0);const initial=previous;for(let i=0;i<500;i++){logits=update(logits,previous.gradient,.2);const next=evaluate(teacher,logits,1,1,.5,0);assert(next.kl<=previous.kl+1e-10);previous=next;}assert(previous.kl<.0001);assert(Math.abs(previous.q[1]-previous.p[1])<Math.abs(initial.q[1]-initial.p[1])); });
test('KL-only ignores the target label', () => { const a=evaluate(teacher,student,0,1,.5,0),b=evaluate(teacher,student,4,1,.5,0);close(a.total,b.total);a.gradient.forEach((g,i)=>close(g,b.gradient[i])); });
test('Matching teacher is stationary in KL-only but not Combined', () => { const a=evaluate(teacher,teacher,1,1,.5,0),b=evaluate(teacher,teacher,1,1,.5);a.gradient.forEach(g=>close(g,0));assert(b.gradient.some(g=>Math.abs(g)>.01)); });
test('Combined can reduce total while increasing KL', () => { const a=evaluate(teacher,student,1,1,.5),b=evaluate(teacher,update(student,a.gradient,.2),1,1,.5);assert(b.total<a.total);assert(b.kl>a.kl); });
test('At temperature 1 the combined optimum is the target-teacher mixture', () => { const lambda=2,p=logSoftmax(teacher).map(Math.exp),q=p.map((v,i)=>(lambda*v+Number(i===1))/(1+lambda));const a=evaluate(teacher,q.map(Math.log),1,lambda,1);a.gradient.forEach(g=>close(g,0)); });
test('Switching off both losses yields zero updates', () => { const a=evaluate(teacher,student,1,0,.5,0);close(a.total,0);a.gradient.forEach(g=>close(g,0)); });
document.getElementById('results').textContent=results.join('\n');document.body.dataset.failed=results.filter(r=>r.startsWith('FAIL')).length;
</script></body></html>
